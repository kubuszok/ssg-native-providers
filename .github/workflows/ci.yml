name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JVM_VERSION: "zulu:25.0.3"

jobs:
  check-formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # .scalafmt.conf `project.git = true` needs git
      - uses: coursier/setup-action@v3.1.1
        with:
          apps: scalafmt # uses the version from .scalafmt.conf; covers build.sbt too
      - run: scalafmt --check

  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: coursier/cache-action@v9
      - uses: coursier/setup-action@v3.1.1
        with:
          jvm: ${{ env.JVM_VERSION }}
          apps: sbt
      - name: Make `sbt` run in the foreground (sbt 2 thin client starts a background server)
        shell: bash
        run: |
          dir="$RUNNER_TEMP/sbt-foreground"; mkdir -p "$dir"
          printf '#!/usr/bin/env bash\nexec "%s" --server "$@"\n' "$(command -v sbt)" > "$dir/sbt"
          chmod +x "$dir/sbt"; echo "$dir" >> "$GITHUB_PATH"

      - name: Download tree-sitter-natives release
        id: download
        continue-on-error: true
        run: scripts/download-release.sh "$TREE_SITTER_NATIVES_VERSION"
        env:
          TREE_SITTER_NATIVES_VERSION: 0.26.8

      - name: Verify sbt loads
        run: sbt projects

      - name: Package & verify JARs
        if: steps.download.outcome == 'success'
        run: |
          sbt packageBin
          scripts/verify-jars.sh
